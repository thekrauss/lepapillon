{{define "base"}}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #FFFBF5; color: #1C1917; }
    .container { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
    .header { text-align: center; margin-bottom: 32px; }
    .logo { font-size: 24px; font-weight: 700; color: #D97706; }
    .card { background: #fff; border: 1px solid #E7E0D8; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
    .btn { display: inline-block; background: #D97706; color: #fff; text-decoration: none; padding: 12px 32px; border-radius: 999px; font-weight: 600; font-size: 14px; }
    .footer { text-align: center; font-size: 12px; color: #78716C; margin-top: 40px; }
    h1 { font-size: 22px; margin: 0 0 16px 0; }
    p { font-size: 15px; line-height: 1.6; color: #78716C; margin: 0 0 16px 0; }
    .highlight { color: #D97706; font-weight: 700; }
    .code { background: #F5F0EB; border-radius: 8px; padding: 16px; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 4px; color: #1C1917; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><span class="logo">Saveurs Thaï</span></div>
    {{template "content" .}}
    <div class="footer">
      <p>Saveurs Thaï — Épicerie thaïlandaise & prestation chef à domicile</p>
      <p>Paris, France — contact@saveursthai.fr</p>
    </div>
  </div>
</body>
</html>{{end}}
